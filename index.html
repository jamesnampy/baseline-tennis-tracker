<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mirrors the metadata/viewport exports of the previous app/layout.tsx. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Baseline — Tennis Tracker</title>
    <meta
      name="description"
      content="A fast, one-handed tennis match tracker for courtside parents."
    />
    <meta name="theme-color" content="#102c2c" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Baseline" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      Social preview. The previous layout.tsx built an absolute URL per request
      from the Host header; a static SPA has no request context, so the origin is
      substituted at build time from VITE_PUBLIC_ORIGIN (see vite.config.ts).
      Leaving it unset yields a relative URL, which most crawlers will not resolve.
    -->
    <meta property="og:title" content="Baseline — Tennis Tracker" />
    <meta
      property="og:description"
      content="A fast, one-handed tennis match tracker for courtside parents."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="__PUBLIC_ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Baseline tennis match tracker" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Baseline — Tennis Tracker" />
    <meta
      name="twitter:description"
      content="A fast, one-handed tennis match tracker for courtside parents."
    />
    <meta name="twitter:image" content="__PUBLIC_ORIGIN__/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
